name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  backend:
    name: Laravel Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel
          MYSQL_USER: laravel
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql

      - name: Install backend dependencies
        working-directory: backend_easyrent
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        working-directory: backend_easyrent
        run: cp .env.example .env

      - name: Set environment variables
        run: |
          echo "DB_CONNECTION=mysql" >> backend_easyrent/.env
          echo "DB_HOST=127.0.0.1" >> backend_easyrent/.env
          echo "DB_PORT=3306" >> backend_easyrent/.env
          echo "DB_DATABASE=laravel" >> backend_easyrent/.env
          echo "DB_USERNAME=laravel" >> backend_easyrent/.env
          echo "DB_PASSWORD=secret" >> backend_easyrent/.env

      - name: Generate app key
        working-directory: backend_easyrent
        run: php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in {1..15}; do
            mysqladmin ping -h 127.0.0.1 -u laravel -proot && break
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run migrations
        working-directory: backend_easyrent
        run: php artisan migrate --force

      - name: Run tests
        working-directory: backend_easyrent
        run: php artisan test --parallel

  frontend:
    name: React Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend_easyrent
        run: npm install

      - name: Run frontend tests
        working-directory: frontend_easyrent
        run: npm test -- --watch=false --reporter dot

      - name: Build frontend
        working-directory: frontend_easyrent
        run: npm run build
